# Verifications automatiques de GitHub : celles de Home Assistant (hassfest) et de HACS.
# Elles tournent a chaque envoi, et une fois par semaine pour suivre les nouvelles versions.
name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
